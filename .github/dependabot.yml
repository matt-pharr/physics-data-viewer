# Dependabot configuration for PDV.
#
# Keeps three ecosystems current on a weekly cadence: the pinned GitHub
# Actions SHAs in .github/workflows/, the Electron app's npm deps under
# electron/, and the Python kernel's pip deps under pdv-python/. Minor and
# patch bumps are grouped per ecosystem so routine maintenance shows up as
# at most one PR per week per ecosystem; security advisories and major
# version bumps still open their own individual PRs.
#
# Every ecosystem also carries a cooldown so freshly-published versions
# sit in the registry for at least 7 days before Dependabot will propose
# them. This is the version-update analogue of uv's --exclude-newer and
# is intended to dodge supply-chain compromises that get caught and
# deprecated within hours (e.g. the 2026-05-11 TanStack incident, which
# was deprecated within ~20 minutes of publish). Security updates — the
# repo-settings toggle, not this file — intentionally bypass the cooldown
# because they patch a known-vulnerable version already in the tree.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    # github-actions tags aren't formal semver, so only default-days
    # is supported here — semver-{major,minor,patch}-days are rejected
    # by Dependabot's validator for this ecosystem.
    cooldown:
      default-days: 7
    # anthropics/claude-code-action is intentionally pinned to the
    # floating @v1 tag (not a SHA) so first-party fixes from Anthropic
    # reach us immediately without a Dependabot round-trip. Suppress
    # the otherwise-routine "bump v1 → v1.x.y" PRs.
    ignore:
      - dependency-name: "anthropics/claude-code-action"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/electron"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/pdv-python"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
