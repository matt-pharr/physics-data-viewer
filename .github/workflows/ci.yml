name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Detect which directory groups changed so downstream jobs can skip
  # work that the PR cannot have affected. Every downstream job still
  # appears in the checks list (as "skipped"), so branch protection
  # rules that require these checks don't get stuck waiting.
  #
  # `node-main-tests` and `e2e-tests` cross the language boundary — they
  # spawn a real Python kernel from Electron code — so they fire on
  # either group of changes.
  filter:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      electron: ${{ steps.filter.outputs.electron }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            python:
              - 'pdv-python/**'
              - '.github/workflows/ci.yml'
            electron:
              - 'electron/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'pdv-python/**'
              - '*.md'
              - '.github/workflows/ci.yml'

  version-parity:
    name: Version parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Always runs — parity drift can happen in any file group, and the
      # check is cheap (~10s). Fails the PR if electron/package.json,
      # pdv-python/pyproject.toml, docs, example modules, and test
      # fixtures don't all agree on the PDV version. Bump them in one
      # shot with scripts/bump-version.sh.
      - name: Check version parity
        run: ./scripts/check-version-parity.sh

  build:
    needs: filter
    if: needs.filter.outputs.electron == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          # Caches ~/.npm so npm fetch is hot on cache miss for the
          # node_modules cache below. Keyed automatically on
          # cache-dependency-path's hash.
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      # On a cache hit, electron/node_modules is restored as-is and the
      # next step is skipped, saving 30-40s vs running `npm ci`. On a
      # miss (package-lock.json changed, or new runner OS), the npm
      # download cache from setup-node above still warms the install.
      - name: Cache electron/node_modules
        id: node-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: electron/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: electron
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        working-directory: electron
        run: npm run build

  typecheck:
    # `tsc --noEmit` on both tsconfig.test.json (main + main-test files) and
    # renderer/tsconfig.json (renderer src + renderer tests). `build:main`
    # alone only typechecks production code (test files are excluded), and
    # vitest transpiles tests via esbuild without typechecking — so test-
    # file type drift was previously invisible to CI. This job closes that
    # gap.
    needs: filter
    if: needs.filter.outputs.electron == 'true'
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Cache electron/node_modules
        id: node-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: electron/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: electron
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        working-directory: electron
        run: npm run typecheck

  python-tests:
    needs: filter
    if: needs.filter.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    name: Python tests (${{ matrix.python-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: pdv-python/pyproject.toml

      - name: Install Python dependencies
        run: pip install ipykernel "pdv-python/[dev]"

      - name: Python tests
        working-directory: pdv-python
        run: pytest tests/ -v

  node-main-tests:
    # Main-process tests spawn a real Python kernel from Electron code, so
    # both language groups can affect them.
    needs: filter
    if: needs.filter.outputs.electron == 'true' || needs.filter.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          # Caches ~/.npm so npm fetch is hot on cache miss for the
          # node_modules cache below. Keyed automatically on
          # cache-dependency-path's hash.
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pdv-python/pyproject.toml

      - name: Install Python dependencies
        run: pip install ipykernel "pdv-python/[dev]"

      # On a cache hit, electron/node_modules is restored as-is and the
      # next step is skipped, saving 30-40s vs running `npm ci`. On a
      # miss (package-lock.json changed, or new runner OS), the npm
      # download cache from setup-node above still warms the install.
      - name: Cache electron/node_modules
        id: node-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: electron/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: electron
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Node tests (main process)
        working-directory: electron
        env:
          PYTHON_PATH: python3
        run: npm run test -- --reporter=verbose main/

  renderer-tests:
    needs: filter
    if: needs.filter.outputs.electron == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          # Caches ~/.npm so npm fetch is hot on cache miss for the
          # node_modules cache below. Keyed automatically on
          # cache-dependency-path's hash.
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      # On a cache hit, electron/node_modules is restored as-is and the
      # next step is skipped, saving 30-40s vs running `npm ci`. On a
      # miss (package-lock.json changed, or new runner OS), the npm
      # download cache from setup-node above still warms the install.
      - name: Cache electron/node_modules
        id: node-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: electron/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: electron
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Renderer tests
        working-directory: electron
        run: npm run test -- --reporter=verbose renderer/src/

  e2e-tests:
    # E2E drives a real Electron build talking to a real Python kernel,
    # so it has to run when either language group changes.
    needs: filter
    if: needs.filter.outputs.electron == 'true' || needs.filter.outputs.python == 'true'
    name: Playwright E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          # Caches ~/.npm so npm fetch is hot on cache miss for the
          # node_modules cache below. Keyed automatically on
          # cache-dependency-path's hash.
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pdv-python/pyproject.toml

      - name: Install Python dependencies
        # xarray + netcdf4 needed by the round-trip checksum spec, which
        # pins serialization for xr.DataArray / xr.Dataset alongside the
        # standard numpy/pandas/matplotlib node types.
        run: pip install ipykernel "pdv-python/[dev]" matplotlib numpy xarray netcdf4

      # On a cache hit, electron/node_modules is restored as-is and the
      # next step is skipped, saving 30-40s vs running `npm ci`. On a
      # miss (package-lock.json changed, or new runner OS), the npm
      # download cache from setup-node above still warms the install.
      - name: Cache electron/node_modules
        id: node-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: electron/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: electron
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Electron needs a display server on Linux CI. xvfb-run wraps the test
      # invocation with a virtual framebuffer so BrowserWindow can render
      # offscreen. The other deps are GTK/X libs Electron links against on
      # Ubuntu — newer ubuntu-latest has most preinstalled, but installing
      # the full set is cheap and avoids drift when the runner image changes.
      - name: Install Electron Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libasound2t64

      - name: Build renderer + main for E2E
        working-directory: electron
        run: npm run build:e2e

      # Cache the matplotlib font cache so the first spec doesn't rebuild it
      # (~17s) and blow the bootstrap timeout. Keyed on the matplotlib version
      # in the installed pdv-python deps.
      - name: Cache matplotlib font cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: electron/e2e/.fixtures-cache/matplotlib
          key: mpl-fontcache-${{ runner.os }}-py3.11-${{ hashFiles('pdv-python/pyproject.toml') }}

      - name: Run Playwright E2E tests
        working-directory: electron
        env:
          PYTHON_PATH: python3
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: |
            electron/playwright-report/
            electron/test-results/
          retention-days: 7

  docs-build:
    # Docs depend on docs/ sources, mkdocs.yml, and pdv-python sources
    # (mkdocstrings introspects the package).
    needs: filter
    if: needs.filter.outputs.docs == 'true'
    name: Docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # git-revision-date-localized-plugin needs full history for the
          # "Last update" timestamps; without this the plugin falls back to
          # the build time and prints noisy warnings.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            pdv-python/pyproject.toml
            docs/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          pip install -e pdv-python/

      # Mirrors the build step in docs.yml. Fails the job on any mkdocs
      # ERROR line — broken cross-refs, missing pages, mkdocstrings
      # resolution failures — so docs breakage is caught at PR time rather
      # than waiting until a tag/release. We don't use `--strict` because
      # that also fails on benign warnings (e.g. git-revision-date plugin
      # complaining about pages with no git history yet).
      - name: Build docs
        run: |
          set -o pipefail
          mkdocs build 2>&1 | tee /tmp/mkdocs.log
          if grep -q "^ERROR" /tmp/mkdocs.log; then
            echo "::error::mkdocs reported ERROR lines (see log above)"
            exit 1
          fi
