name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # Called by dist.yml at release time so a tag can't ship on red — the full
  # CI must pass first. `run-all` forces every job on because paths-filter has
  # no diff base to compute changed files against on a tag ref.
  workflow_call:
    inputs:
      run-all:
        description: "Run all jobs regardless of changed paths (release gate)."
        type: boolean
        default: false

jobs:
  # Detect which directory groups changed so downstream jobs can skip
  # work that the PR cannot have affected. Every downstream job still
  # appears in the checks list (as "skipped"), so branch protection
  # rules that require these checks don't get stuck waiting.
  #
  # `node-main-tests` and `e2e-tests` cross the language boundary — they
  # spawn a real Python kernel from Electron code — so they fire on
  # either group of changes.
  filter:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # When invoked as a release gate (run-all), force every group on;
      # otherwise use the detected changes. `inputs.run-all` is empty (falsy)
      # on push/pull_request events, so the `|| steps...` branch applies there.
      python: ${{ inputs.run-all && 'true' || steps.filter.outputs.python }}
      julia: ${{ inputs.run-all && 'true' || steps.filter.outputs.julia }}
      electron: ${{ inputs.run-all && 'true' || steps.filter.outputs.electron }}
      docs: ${{ inputs.run-all && 'true' || steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        # Skip on the release gate: a tag ref has no base to diff against.
        if: ${{ !inputs.run-all }}
        with:
          filters: |
            python:
              - 'pdv-python/**'
              - '.github/workflows/ci.yml'
            julia:
              - 'pdv-julia/**'
              - '.github/workflows/ci.yml'
            electron:
              - 'electron/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'pdv-python/**'
              - '*.md'
              - '.github/workflows/ci.yml'

  version-parity:
    name: Version parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Always runs — parity drift can happen in any file group, and the
      # check is cheap (~10s). Fails the PR if electron/package.json,
      # pdv-python/pyproject.toml, docs, example modules, and test
      # fixtures don't all agree on the PDV version. Bump them in one
      # shot with scripts/bump-version.sh.
      - name: Check version parity
        run: ./scripts/check-version-parity.sh

  build:
    needs: filter
    if: needs.filter.outputs.electron == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          # Caches ~/.npm so npm fetch is hot on cache miss for the
          # node_modules cache below. Keyed automatically on
          # cache-dependency-path's hash.
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      # On a cache hit, electron/node_modules is restored as-is and the
      # next step is skipped, saving 30-40s vs running `npm ci`. On a
      # miss (package-lock.json changed, or new runner OS), the npm
      # download cache from setup-node above still warms the install.
      - name: Cache electron/node_modules
        id: node-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: electron/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: electron
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        working-directory: electron
        run: npm run build

  typecheck:
    # `tsc --noEmit` on both tsconfig.test.json (main + main-test files) and
    # renderer/tsconfig.json (renderer src + renderer tests). `build:main`
    # alone only typechecks production code (test files are excluded), and
    # vitest transpiles tests via esbuild without typechecking — so test-
    # file type drift was previously invisible to CI. This job closes that
    # gap.
    needs: filter
    if: needs.filter.outputs.electron == 'true'
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Cache electron/node_modules
        id: node-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: electron/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: electron
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        working-directory: electron
        run: npm run typecheck

      # knip catches unused files/exports/dependencies. Runs in the typecheck
      # job to reuse the warmed node_modules cache rather than spinning up a
      # separate job.
      - name: Knip (unused files/exports/deps)
        working-directory: electron
        run: npm run knip

  python-tests:
    needs: filter
    if: needs.filter.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    name: Python tests (${{ matrix.python-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: pdv-python/pyproject.toml

      - name: Install Python dependencies
        run: pip install ipykernel "pdv-python/[dev]"

      - name: Python tests
        working-directory: pdv-python
        run: pytest tests/ -v

  julia-tests:
    # The PDVKernel.jl unit suite (kernel-free — the comm transport is
    # stubbed, so no IJulia/Jupyter session is spawned). Until this job
    # existed the 500+ Julia tests ran only on developer machines, so a
    # pdv-julia regression could merge on green CI (third-review finding).
    # Julia-side integration against a real kernel remains local-only
    # (main/integration-julia.test.ts, JULIA_PATH-gated).
    needs: filter
    if: needs.filter.outputs.julia == 'true'
    name: Julia tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32  # v3.0.2
        with:
          # Track the minor the app develops and ships against (§10.7);
          # exact patch floats with the channel, same as juliaup's "1.11".
          version: '1.11'

      # Caches ~/.julia (packages, artifacts, compiled caches) keyed on the
      # Project.toml; first cold run pays the full resolve+precompile
      # (~5-10 min), warm runs start in seconds.
      - name: Cache Julia depot
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38  # v3.1.0

      - name: Julia tests
        run: |
          julia --project=pdv-julia --color=yes -e '
            using Pkg
            Pkg.instantiate()
            Pkg.test()'

  dep-sweep:
    # Enforce the CLAUDE.md pre-merge convention: any change under pdv-python/
    # must pass the dependency-resolution sweep (Python 3.10–3.14 × extras ×
    # highest/lowest-direct resolution). Catches unguarded optional imports and
    # too-low version floors that the single [dev] install in `python-tests`
    # would miss.
    needs: filter
    if: needs.filter.outputs.python == 'true'
    name: Dependency sweep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      # uv downloads managed CPython builds for the matrix versions not present
      # on the runner. ~3-4 min total.
      - name: Dependency-resolution sweep
        working-directory: pdv-python
        run: ./scripts/sweep-deps.sh

  node-main-tests:
    # Main-process tests spawn a real Python kernel from Electron code, so
    # both language groups can affect them.
    needs: filter
    if: needs.filter.outputs.electron == 'true' || needs.filter.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          # Caches ~/.npm so npm fetch is hot on cache miss for the
          # node_modules cache below. Keyed automatically on
          # cache-dependency-path's hash.
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pdv-python/pyproject.toml

      - name: Install Python dependencies
        run: pip install ipykernel "pdv-python/[dev]"

      # On a cache hit, electron/node_modules is restored as-is and the
      # next step is skipped, saving 30-40s vs running `npm ci`. On a
      # miss (package-lock.json changed, or new runner OS), the npm
      # download cache from setup-node above still warms the install.
      - name: Cache electron/node_modules
        id: node-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: electron/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: electron
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Node tests (main process)
        working-directory: electron
        env:
          PYTHON_PATH: python3
        run: npm run test -- --reporter=verbose main/

  renderer-tests:
    needs: filter
    if: needs.filter.outputs.electron == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          # Caches ~/.npm so npm fetch is hot on cache miss for the
          # node_modules cache below. Keyed automatically on
          # cache-dependency-path's hash.
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      # On a cache hit, electron/node_modules is restored as-is and the
      # next step is skipped, saving 30-40s vs running `npm ci`. On a
      # miss (package-lock.json changed, or new runner OS), the npm
      # download cache from setup-node above still warms the install.
      - name: Cache electron/node_modules
        id: node-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: electron/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: electron
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Renderer tests
        working-directory: electron
        run: npm run test -- --reporter=verbose renderer/src/

  e2e-tests:
    # E2E drives a real Electron build talking to a real Python kernel,
    # so it has to run when either language group changes.
    needs: filter
    if: needs.filter.outputs.electron == 'true' || needs.filter.outputs.python == 'true'
    name: Playwright E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          # Caches ~/.npm so npm fetch is hot on cache miss for the
          # node_modules cache below. Keyed automatically on
          # cache-dependency-path's hash.
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pdv-python/pyproject.toml

      - name: Install Python dependencies
        # xarray + netcdf4 needed by the round-trip checksum spec, which
        # pins serialization for xr.DataArray / xr.Dataset alongside the
        # standard numpy/pandas/matplotlib node types.
        run: pip install ipykernel "pdv-python/[dev]" matplotlib numpy xarray netcdf4

      # On a cache hit, electron/node_modules is restored as-is and the
      # next step is skipped, saving 30-40s vs running `npm ci`. On a
      # miss (package-lock.json changed, or new runner OS), the npm
      # download cache from setup-node above still warms the install.
      - name: Cache electron/node_modules
        id: node-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: electron/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: electron
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Electron needs a display server on Linux CI. xvfb-run wraps the test
      # invocation with a virtual framebuffer so BrowserWindow can render
      # offscreen. The other deps are GTK/X libs Electron links against on
      # Ubuntu — newer ubuntu-latest has most preinstalled, but installing
      # the full set is cheap and avoids drift when the runner image changes.
      - name: Install Electron Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libasound2t64

      - name: Build renderer + main for E2E
        working-directory: electron
        run: npm run build:e2e

      # Cache the matplotlib font cache so the first spec doesn't rebuild it
      # (~17s) and blow the bootstrap timeout. Keyed on the matplotlib version
      # in the installed pdv-python deps.
      - name: Cache matplotlib font cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: electron/e2e/.fixtures-cache/matplotlib
          key: mpl-fontcache-${{ runner.os }}-py3.11-${{ hashFiles('pdv-python/pyproject.toml') }}

      # Cache uv's package cache (launch.ts pins UV_CACHE_DIR here) so the
      # uv-project specs don't re-download their default dependencies every
      # run. Keyed on the files that determine what those specs install —
      # the defaultPackages list (config.ts) and the supported Python
      # versions (python-versions.ts) — with a prefix fallback so a key
      # change still restores the previous cache and only downloads the
      # delta.
      - name: Cache uv package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: electron/e2e/.fixtures-cache/uv
          key: uv-cache-${{ runner.os }}-${{ hashFiles('electron/main/config.ts', 'electron/main/python-versions.ts') }}
          restore-keys: |
            uv-cache-${{ runner.os }}-

      - name: Run Playwright E2E tests
        working-directory: electron
        env:
          PYTHON_PATH: python3
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: |
            electron/playwright-report/
            electron/test-results/
          retention-days: 7

  docs-build:
    # Docs depend on docs/ sources, mkdocs.yml, and pdv-python sources
    # (mkdocstrings introspects the package).
    needs: filter
    if: needs.filter.outputs.docs == 'true'
    name: Docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # git-revision-date-localized-plugin needs full history for the
          # "Last update" timestamps; without this the plugin falls back to
          # the build time and prints noisy warnings.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            pdv-python/pyproject.toml
            docs/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          pip install -e pdv-python/

      # Mirrors the build step in docs.yml. Fails the job on any mkdocs
      # ERROR line — broken cross-refs, missing pages, mkdocstrings
      # resolution failures — so docs breakage is caught at PR time rather
      # than waiting until a tag/release. We don't use `--strict` because
      # that also fails on benign warnings (e.g. git-revision-date plugin
      # complaining about pages with no git history yet).
      - name: Build docs
        run: |
          set -o pipefail
          mkdocs build 2>&1 | tee /tmp/mkdocs.log
          if grep -q "^ERROR" /tmp/mkdocs.log; then
            echo "::error::mkdocs reported ERROR lines (see log above)"
            exit 1
          fi

  # Single aggregate check for branch protection. Path-filtered jobs report
  # "skipped" when their group didn't change; this job treats skipped/success
  # as OK and fails only on a real failure or cancellation — so the required
  # check stays stable even as the job matrix changes, and dist.yml can gate
  # the release on this one job via workflow_call.
  ci-ok:
    name: CI OK
    needs:
      - filter
      - version-parity
      - build
      - typecheck
      - python-tests
      - julia-tests
      - dep-sweep
      - node-main-tests
      - renderer-tests
      - e2e-tests
      - docs-build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify no required job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not succeed (result: $r)"
              exit 1
            fi
          done
          echo "All required jobs succeeded or were skipped."
