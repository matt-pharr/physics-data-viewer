[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdv-python"
version = "0.1.2"
description = "PDV kernel support package — implements the PDV comm protocol and data structures for Python kernels."
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.0",
    "xxhash>=3.0",
]

[project.optional-dependencies]
# Optional data format support — imported lazily inside serialization.py.
# Floors set to the oldest versions that build on Python 3.12+ (earlier
# numpy/pandas depend on the removed `distutils` stdlib module).
data = [
    "numpy>=2.2",
    "pandas>=2.2.3",
]
# Optional copy-on-write file cloning for faster file operations
copy = [
    "reflink-copy>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "numpy>=2.2",
    "pandas>=2.2.3",
    "reflink-copy>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pdv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
