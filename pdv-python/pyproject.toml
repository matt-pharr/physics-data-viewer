[build-system]
# setuptools>=77 is required for the SPDX `license = "MIT"` string form below
# (PEP 639); earlier releases only understand the deprecated table form.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdv-python"
version = "0.2.0"
description = "PDV kernel support package — implements the PDV comm protocol and data structures for Python kernels."
readme = "README.md"
license = "MIT"
authors = [{ name = "Matthew Pharr" }]
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.0",
    "xxhash>=3.0",
    # 3.10.5 is the floor: 3.10.0 has a Path.__deepcopy__ infinite-recursion
    # bug that breaks pandas .plot(), and 3.10.5 is the first release with
    # Python 3.14 wheels.
    "matplotlib>=3.10.5",
    # numpy is a core dependency: matplotlib already pulls it in transitively,
    # and checksum.py / serialization.py import it directly. Pinning it here
    # (rather than relying on the transitive resolution) guarantees the >=2.2
    # floor the PDV code expects instead of whatever matplotlib happens to
    # allow. 2.2 is the oldest that builds on Python 3.12+ (earlier numpy
    # depends on the removed `distutils` stdlib module).
    "numpy>=2.2",
]

[project.optional-dependencies]
# Optional data format support — imported lazily inside serialization.py.
# numpy is a core dependency (see above); pandas stays optional. Floor set to
# the oldest version that builds on Python 3.12+ (earlier pandas depends on
# the removed `distutils` stdlib module).
data = [
    "pandas>=2.2.3",
]
# Optional copy-on-write file cloning for faster file operations
copy = [
    "reflink-copy>=0.2",
]
# Namelist editor (PDVNamelist) support. f90nml handles Fortran namelists;
# tomli-w handles TOML writes (TOML reads use the stdlib `tomllib`). Both are
# imported lazily inside pdv/namelist_utils.py — this extra is the supported
# install path for the shipped namelist feature.
namelist = [
    "f90nml>=1.4",
    "tomli-w>=1.0",
]
# xarray Dataset serialization support (imported lazily in serialization.py).
# Pure-Python; no NetCDF engine is required — PDV serializes datasets without
# calling `to_netcdf`.
xarray = [
    "xarray>=2024.7.0",
]
# PDVDataset (lazy NetCDF tree nodes): xarray plus a NetCDF backend engine.
# netcdf4 is the canonical engine; at runtime PDV also accepts h5netcdf or
# scipy if one of those is already present. 1.7.4 is the first netcdf4
# release with Python 3.14 Linux wheels — older floors fail the dep
# sweep's py3.14 lowest-direct cell on CI (sdist build needs system
# netcdf-c headers the runners don't have).
netcdf = [
    "xarray>=2024.7.0",
    "netcdf4>=1.7.4",
]
# PDVHdf5 (lazy HDF5 tree nodes). 3.15 is the first h5py release with
# Python 3.14 wheels — older floors fail the dep sweep's py3.14
# lowest-direct cell with an sdist Cython build error.
hdf5 = [
    "h5py>=3.15",
]
# The dev extra installs everything the test suite exercises so no test is
# silently skipped: keep it a superset of every optional feature's deps, with
# identical version floors so lowest-direct resolution agrees with the
# feature extras above.
dev = [
    "pytest>=8.0",
    "pandas>=2.2.3",
    "reflink-copy>=0.2",
    "f90nml>=1.4",
    "tomli-w>=1.0",
    "xarray>=2024.7.0",
    "netcdf4>=1.7.4",
    "h5py>=3.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pdv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
