appId: com.pdv.physics-data-viewer
productName: PDV
copyright: Copyright © 2026

publish:
  provider: github
  owner: matt-pharr
  repo: physics-data-viewer

directories:
  output: release
  buildResources: build

# What goes into the app bundle (inside app.asar)
# Note: renderer/dist/ is in .gitignore (it's a build artifact), but we need
# it in the packaged app. The "filter" form with explicit includes overrides
# .gitignore exclusions.
files:
  - from: "."
    to: "."
    filter:
      - dist/**/*
      # The server bundle ships via extraResources (below) as a real file the
      # plain-Node child can require. Without this exclude `dist/**/*` also
      # copies it into the asar, where nothing can load it — ~2.3 MB of dead
      # weight in every build.
      - "!dist/server-bundle/**"
      - renderer/dist/**/*
      - package.json
      - node_modules/**/*
      - "!node_modules/**/*.{ts,map,md}"
      - "!node_modules/**/{test,tests,__tests__}/**"

# Native modules (.node binaries) cannot be loaded from inside an asar
# archive. This extracts zeromq to app.asar.unpacked/ alongside the asar.
# cmake-ts must ride along: zeromq's lib/load-addon.js does
# require("cmake-ts/build/loader") at runtime, and the pdv-server child runs
# under plain Node (ELECTRON_RUN_AS_NODE), which cannot resolve modules from
# inside the asar at all — everything on zeromq's runtime require path has to
# be a real file.
#
# node-addon-api is listed defensively only. It is headers-only (not on any
# runtime require path), and it currently resolves under
# node_modules/zeromq/node_modules/, so the zeromq glob already covers it and
# this pattern matches nothing at the top level. Kept so a future hoist that
# moves it up cannot quietly strand it inside the asar.
# node-pty is unpacked for two reasons: its prebuilt pty.node is a native
# binary, and on macOS/Linux UnixTerminal execs a sibling `spawn-helper`
# executable by path — neither can be loaded or exec'd from inside an asar.
# The helper's executable bit is restored at install time by
# scripts/fix-node-pty-perms.mjs (node-pty ships it 644); electron-builder
# copies whatever mode it finds, so that fix has to happen before packaging
# or the packaged app fails with `posix_spawnp failed.`
#
# node-pty is shell-only. It must never reach the pdv-server bundle, which
# runs as plain Node on a remote host that has no such binary.
asarUnpack:
  - "node_modules/zeromq/**"
  - "node_modules/cmake-ts/**"
  - "node_modules/node-addon-api/**"
  - "node_modules/node-pty/**"

# pdv-python source is placed into the app's Resources directory
# (Contents/Resources/ on macOS, resources/ on Linux).
# Not inside the asar — it needs to be pip-installable from disk.
extraResources:
  - from: ../pdv-python
    to: pdv-python
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/tests/**"
      - "!**/.pytest_cache/**"
      - "!**/.git/**"
      # Local dev/build droppings (uv venv, setuptools build dir + egg-info
      # from the wheel prebuild, linter caches). Without these excludes a
      # developer machine's 100+ MB .venv rides into Resources/pdv-python and
      # codesign has to sign every file in it.
      - "!.venv/**"
      - "!build/**"
      - "!*.egg-info/**"
      - "!.ruff_cache/**"
  # pdv-julia source, staged by julia-discovery.ts into <userData>/pdv-julia
  # and Pkg.develop'ed by the one-click PDVKernel install (§10.7.4).
  # resolveBundledPDVJuliaPath() expects <Resources>/pdv-julia in packaged
  # builds — without this entry the install can only ever work in dev
  # (PR #347 review B3).
  - from: ../pdv-julia
    to: pdv-julia
    filter:
      - "**/*"
      - "!test/**"
      - "!**/.git/**"
  - from: ../examples/modules
    to: examples/modules
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  # The pdv-server bundle (built by `npm run build:server`). It runs under
  # plain Node (ELECTRON_RUN_AS_NODE), which cannot require() from inside the
  # asar archive, so it must be a real file on disk. server-supervisor.ts
  # resolves <Resources>/pdv-server/pdv-server.cjs in packaged builds, with
  # zeromq loaded from app.asar.unpacked via PDV_ZEROMQ_PATH.
  - from: dist/server-bundle
    to: pdv-server

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  category: public.app-category.developer-tools
  icon: assets/pdv-icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extraResources:
    - from: assets/Assets.car
      to: Assets.car
    # Per-platform uv binary, fetched by scripts/fetch-uv.mjs (ARCHITECTURE.md §10.5.6).
    # Resolved at runtime as <Resources>/uv/uv by uv-runner.ts.
    - from: resources/uv/darwin-arm64
      to: uv
    # App-managed pdv-python wheel, built by scripts/build-pdv-wheel.mjs (§10.5.7).
    - from: resources/pdv-python-wheel
      to: pdv-python-wheel
  extendInfo:
    CFBundleIconName: pdv-macicon
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
linux:
  category: Science
  icon: assets/pdv-icon-linux.svg
  # Per-platform uv binary, fetched by scripts/fetch-uv.mjs (ARCHITECTURE.md §10.5.6).
  # Resolved at runtime as <Resources>/uv/uv by uv-runner.ts.
  extraResources:
    - from: resources/uv/linux-x64
      to: uv
    # App-managed pdv-python wheel, built by scripts/build-pdv-wheel.mjs (§10.5.7).
    - from: resources/pdv-python-wheel
      to: pdv-python-wheel
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
